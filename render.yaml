services:
  - type: web
    name: naftal-app
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: GPS_API_URL
        sync: false
      - key: GPS_API_METHOD
        value: GET
      - key: GPS_API_HEADERS_JSON
        value: '{}'
      - key: GPS_API_BODY
        value: ''
      - key: GPS_SYNC_INTERVAL_MS
        value: '120000'
      - key: GPS_SITE_LAT
        sync: false
      - key: GPS_SITE_LNG
        sync: false
      - key: GPS_SITE_RADIUS_METERS
        value: '500'
      - key: GPS_FUEL_SENSOR_KEY
        value: io87
      - key: GPS_TANK_CAPACITY
        value: '600'
